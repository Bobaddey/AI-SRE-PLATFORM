apiVersion: apps/v1
kind: Deployment

metadata:
  name: checkout-api
  namespace: applications

spec:
  replicas: 1

  selector:
    matchLabels:
      app: checkout-api

  template:
    metadata:
      labels:
        app: checkout-api
        team: payments

    spec:
      containers:
        - name: checkout-api

          image: nginx:1.27

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi