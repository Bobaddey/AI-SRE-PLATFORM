apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-team-label
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-team-label
      match:
        any:
          - resources:
              kinds:
                - Pod
      # `exclude` is a rule-level field (spec.rules[].exclude), not spec.exclude.
      exclude:
        any:
          - resources:
              namespaces:
                - observability
      validate:
        message: "Pods must have a team label."
        pattern:
          metadata:
            labels:
              team: "?*"
